<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  try {
    const saved = localStorage.getItem('pulse-theme');
    document.documentElement.dataset.theme =
      saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch { document.documentElement.dataset.theme = 'light'; }
</script>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" id="brand" href="#/">Pulse</a>
    <button class="nav-toggle" id="navToggle" type="button"
            aria-label="Open navigation" aria-expanded="false" aria-controls="nav"></button>
    <nav class="nav" id="nav"></nav>
    <div class="topbar-meta">
      <button class="ghost" id="searchToggle" type="button" aria-label="Search Pulse" title="Search  ⌘K">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
      <span id="clock"></span>
      <span id="health"></span>
      <button class="ghost" id="themeToggle" type="button" aria-label="Switch theme"></button>
    </div>
  </div>
</header>

<main class="wrap" id="view">
  <p class="muted pad">Loading…</p>
</main>

<script src="app.js" type="module"></script>
</body>
</html>
