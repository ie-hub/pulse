# Builds the static snapshot and publishes it to GitHub Pages.
#
# Pages serves files, so the Node server cannot run there. This workflow runs
# buildState() on a schedule, writes dist/state.json, and deploys dist/. The
# published site is a snapshot as old as the last successful run.

name: Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 3 hours. Feeds reach back about 24h, so this is well inside their
    # window; raising the frequency mostly buys churn, not information.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# snapshot is worse than one that is three hours old.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — this project has none.
      - name: Build snapshot
        run: node scripts/build-static.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
